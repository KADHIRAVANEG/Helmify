services:
  api:
    image: myorg/api:1.2.0
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=debug
      - PORT=8080
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: "256Mi"
        reservations:
          cpus: "0.1"
          memory: "128Mi"

  worker:
    image: myorg/worker:1.2.0
    environment:
      QUEUE_NAME: jobs
    command: ["python", "worker.py"]
