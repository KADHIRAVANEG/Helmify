# values.yaml generated by helmify

web:
  replicaCount: 2
  image:
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  env:
    - name: LOG_LEVEL
      value: "info"
  ports:
    - name: http
      containerPort: 80
      protocol: TCP

