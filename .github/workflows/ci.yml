name: CI

on:
  push:
    branches: [main, Develop, Features, Docs]
  pull_request:
    branches: [main, Develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Smoke test - generate chart from example manifests
        run: |
          go run ./cmd/helmify generate \
            --input examples/yaml-input/manifests \
            --output /tmp/ci-chart \
            --name ci-smoke-test \
            --secure

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm lint generated chart
        run: helm lint /tmp/ci-chart
